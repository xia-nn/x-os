UI vesamenu.c32

MENU TITLE X OS
MENU AUTOBOOT Starting X OS in # seconds
MENU BACKGROUND splash.png

MENU COLOR screen    37;40      #c9d1d9 #0b0e14 std
MENU COLOR border    30;44      #1f6feb #0b0e14 std
MENU COLOR title     1;36;44    #e6e9f0 #0b0e14 std
MENU COLOR unsel     37;40      #c9d1d9 #0b0e14 std
MENU COLOR sel       7;37;40    #ffffff #1f6feb std
MENU COLOR hotsel    7;37;40    #ffffff #388bfd std
MENU COLOR help      37;40      #8b949e #0b0e14 std

DEFAULT xos
TIMEOUT 30

LABEL xos
TEXT HELP
Boot the X OS live medium (x86_64).
ENDTEXT
MENU LABEL Boot X OS (x86_64)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash

LABEL xos-nomodeset
TEXT HELP
Boot X OS with nomodeset (safe graphics).
ENDTEXT
MENU LABEL Boot X OS (nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash nomodeset
