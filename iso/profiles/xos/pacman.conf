#
# X OS — pacman.conf（Archiso 构建用）
# 标准 Arch 仓库配置；构建时由 pacstrap 复制进 chroot。
#

[options]
HoldPkg      = pacman glibc
Architecture = auto

# 并行下载以加快构建
ParallelDownloads = 5

# 签名校验
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
