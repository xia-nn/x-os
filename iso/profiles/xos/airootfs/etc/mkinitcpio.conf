# mkinitcpio.conf for X OS Live ISO
# Includes archiso hooks so the initramfs can locate and switch-root into
# the squashfs image on the live medium.

MODULES=()
BINARIES=()
FILES=()

# Order matters. 'archiso' and 'archiso_loop_mnt' are provided by the
# mkinitcpio-archiso package and are required for booting the ISO.
HOOKS=(base udev archiso memdisk archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)

# vim:set ft=sh ts=2 sw=2 et:
